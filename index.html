<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 10 </title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">

        <!-- TASK 1 & 4: Fetch Users  -->
        <section>
            <h2> Fetch Users</h2>
            <button id="fetch-btn" class="btn-primary">Load Users</button>
            <div id="user-cards" class="card-grid">
                <p class="placeholder">Click the button to load users.</p>
            </div>
        </section>

        <hr />

        <section>
            <h2> Products</h2>
            <div id="product-list" class="card-grid"></div>

            <h3 style="margin-top: 2rem;">🛒 Your Cart</h3>
            <div id="cart-items">
                <p class="placeholder">Cart is empty.</p>
            </div>
            <p class="total-line">
                <strong>Total (incl. 16% tax):</strong> K<span id="cart-total">0.00</span>
            </p>
        </section>

    </div>
    <script type="module" src="script.js"></script>
